{% extends "tasks/base.html" %}

{% block title %}Add Priority | Hangarin{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <a href="{% url 'priorities_list' %}" class="back-link">
            ← Back to Priorities
        </a>

        <h1>Add Priority</h1>

        <p>Create a new priority level for your tasks.</p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        {% include 'tasks/includes/form.html' %}

        <div class="form-actions">

            <a href="{% url 'priorities_list' %}" class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="submit-button">
                Add Priority
            </button>

        </div>

    </form>

</div>

{% endblock %}
