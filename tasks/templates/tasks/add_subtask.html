{% extends "tasks/base.html" %}

{% block title %}Add SubTask | Hangarin{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <a href="{% url 'task_detail' task.id %}" class="back-link">
            ← Back to Task
        </a>

        <h1>Add SubTask</h1>

        <p>
            Add a smaller step to
            <strong>{{ task.title }}</strong>.
        </p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        {% include 'tasks/includes/form.html' %}

        <div class="form-actions">

            <a
                href="{% url 'task_detail' task.id %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="submit-button"
            >
                Add SubTask
            </button>

        </div>

    </form>

</div>

{% endblock %}
