{% extends "tasks/base.html" %}

{% block title %}Edit SubTask | Hangarin{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <a
            href="{% url 'task_detail' subtask.parent_task.id %}"
            class="back-link"
        >
            ← Back to Task
        </a>

        <h1>Edit SubTask</h1>

        <p>Update your SubTask details.</p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="title">SubTask Title</label>

            <input
                type="text"
                id="title"
                name="title"
                value="{{ subtask.title }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="status">Status</label>

            <select
                id="status"
                name="status"
                required
            >

                {% for value, label in status_choices %}

                    <option
                        value="{{ value }}"
                        {% if subtask.status == value %}selected{% endif %}
                    >
                        {{ label }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-actions">

            <a
                href="{% url 'task_detail' subtask.parent_task.id %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="submit-button"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
