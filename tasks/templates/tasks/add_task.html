{% extends "tasks/base.html" %}

{% block title %}Add Task | Hangarin{% endblock %}

{% block content %}

<div class="page-header">
    <a href="/" class="back-link">← Back to Dashboard</a>

    <h1>Add New Task</h1>
    <p>Create a task and keep your day organized.</p>
</div>


<div class="form-card">

    <form method="POST">
        {% csrf_token %}

        {% include 'tasks/includes/form.html' %}

        <div class="form-actions">

            <a href="/" class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="submit-button">
                Add Task
            </button>

        </div>

    </form>

</div>

{% endblock %}
