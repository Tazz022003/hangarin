{% extends "tasks/base.html" %}

{% block title %}Edit Note | Hangarin{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <a
            href="{% url 'task_detail' note.task.id %}"
            class="back-link"
        >
            ← Back to Task
        </a>

        <h1>Edit Note</h1>

        <p>
            Update your note on
            <strong>{{ note.task.title }}</strong>.
        </p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        {% include 'tasks/includes/form.html' %}

        <div class="form-actions">

            <a
                href="{% url 'task_detail' note.task.id %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="submit-button"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
