{% extends "tasks/base.html" %}

{% block title %}Add SubTask | Hangarin{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <a href="{% url 'task_detail' task.id %}" class="back-link">
            ← Back to Task
        </a>

        <h1>Add SubTask</h1>

        <p>
            Add a smaller step to
            <strong>{{ task.title }}</strong>.
        </p>

    </div>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label for="title">SubTask Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="What smaller step needs to be done?"
                required
            >

        </div>


        <div class="form-group">

            <label for="status">Status</label>

            <select
                id="status"
                name="status"
                required
            >

                {% for value, label in status_choices %}

                    <option value="{{ value }}">
                        {{ label }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-actions">

            <a
                href="{% url 'task_detail' task.id %}"
                class="cancel-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="submit-button"
            >
                Add SubTask
            </button>

        </div>

    </form>

</div>

{% endblock %}
